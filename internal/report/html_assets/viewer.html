<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scenaria Report</title>
  <style>__CSS__</style>
</head>
<body>
  <header>
    <h1 id="brand-title">Scenaria Report</h1>
    <div class="meta" id="meta-line"></div>
    <div class="stats">
      <span class="pass" id="stat-pass"></span>
      <span class="fail" id="stat-fail"></span>
      <span class="skip" id="stat-skip"></span>
      <span id="stat-flaky"></span>
      <span id="stat-slow"></span>
      <span id="light-badge"></span>
    </div>
    <div id="ci-compare" class="ci-compare"></div>
    <div class="toolbar">
      <button type="button" id="toggle-sidebar">Scenarios</button>
      <button type="button" id="export-failed">Export failed .feature</button>
    </div>
  </header>
  <div class="layout">
    <aside class="panel sidebar" id="sidebar">
      <div class="panel-head">Scenarios</div>
      <div class="filters">
        <input id="filter-search" type="search" placeholder="Поиск…">
        <label><input type="checkbox" id="filter-failed"> Только упавшие</label>
        <input id="filter-tag" type="text" placeholder="Фильтр по тегу (@smoke)">
        <input id="filter-duration" type="number" min="0" step="100" placeholder="Мин. длительность (ms)">
      </div>
      <div class="scenario-list" id="scenario-list"></div>
    </aside>
    <main class="panel">
      <div class="panel-head panel-head-tabs">
        <span id="timeline-title">Timeline</span>
        <div class="tabs">
          <button type="button" id="tab-timeline" class="tab active" data-tab="timeline">Timeline</button>
          <button type="button" id="tab-actionlog" class="tab" data-tab="actionlog">Action log</button>
          <button type="button" id="tab-trace" class="tab" data-tab="trace" hidden>Trace</button>
        </div>
      </div>
      <div class="timeline-wrap" id="timeline"><div class="empty">…</div></div>
      <div class="timeline-wrap" id="actionlog" hidden></div>
      <div class="timeline-wrap" id="traceview" hidden></div>
    </main>
    <aside class="panel inspector-panel open" id="inspector-panel">
      <div class="panel-head">Inspector</div>
      <div class="inspector" id="inspector"><div class="empty">Выберите шаг</div></div>
    </aside>
  </div>
  <script id="scenaria-report-data" type="application/json">__JSON__</script>
  <script>__JS__</script>
</body>
</html>
